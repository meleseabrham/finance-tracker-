services:

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fintrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fintrack_net
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Adminer (DB GUI) ────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: fintrack_adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    networks:
      - fintrack_net

  # ─── Node.js API ─────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: finacetracker-server:latest
    container_name: fintrack_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finance_tracker
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: fintrack_dev_secret_change_me
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    networks:
      - fintrack_net

  # ─── React Client (nginx) ────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: finacetracker-client:latest
    container_name: fintrack_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"
    networks:
      - fintrack_net

networks:
  fintrack_net:
    driver: bridge

volumes:
  pgdata:
